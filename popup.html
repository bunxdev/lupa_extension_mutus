<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>mutus</h1>
      <label class="switch" title="activar / desactivar">
        <input id="toggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="label">muteados</div>
        <div id="count" class="count">0</div>
      </div>
      <div class="stat">
        <div class="label">saltados</div>
        <div id="skipped" class="count alt">0</div>
      </div>
    </section>

    <label class="row" title="hacer click automático en 'Saltar anuncio' cuando aparezca">
      <input id="skip-toggle" type="checkbox" />
      <span>saltar anuncios</span>
    </label>

    <details class="ads-list">
      <summary>
        <span>últimos anuncios</span>
        <span id="ads-count" class="badge">0</span>
      </summary>
      <ul id="ads"></ul>
      <button id="clear-ads" class="btn ghost">limpiar lista</button>
    </details>

    <button id="reset" class="btn">resetear contadores</button>

    <footer>
      <a href="http://127.0.0.1:3080/monsterbunx/mutus" target="_blank" rel="noopener">monsterbunx/mutus</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
